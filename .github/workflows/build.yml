name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -60 || true
          grep -E "^e: |error:" build.log | sort -u | head -10 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FingerError.apk

      - uses: actions/upload-artifact@v5
        with:
          name: FingerError-apk
          path: FingerError.apk

      # 폰에서 바로 받을 수 있는 고정 링크
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 핑거에러 최신 버전
          files: FingerError.apk
          make_latest: true
